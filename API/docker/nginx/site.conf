server {
    index index.php index.html;
    listen 80;
    client_max_body_size 100M;
    client_body_timeout 300;
    proxy_read_timeout 600;  # Aumenta o tempo limite de leitura para 10 minutos
    proxy_connect_timeout 600;  # Aumenta o tempo limite de conexão para 10 minutos
    proxy_send_timeout 600;  # Aumenta o tempo limite de envio para 10 minutos
    send_timeout 600;  # Aumenta o tempo de envio para 10 minutos
    
    server_name local.desafio-desenvolvedor;
    error_log  /var/log/nginx/desafio-desenvolvedor.co-error.log;
    access_log /var/log/nginx/desafio-desenvolvedor.co-access.log;
    root /usr/share/nginx/html/public;
    ssl_protocols       SSLv3 TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass OLIVEIRA_TRUST_PHP83:9000;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    location /docs {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
