openapi: 3.0.3
info:
  title: 'Desafio Desenvolvedor - Oliveira Trust'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8084'
paths:
  /api/upload-file:
    post:
      summary: 'Realizar o Upload do Arquivo'
      operationId: realizarOUploadDoArquivo
      description: '<p>Este Endpoint Realiza o <strong>Upload e Processamento do Arquivo</strong>. É Necessário para um valor chamado <strong>arquivo</strong> no body da requisição, nos formatos CSV ou XLSX</p>.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "{\n    \"message\": \"O Arquivo nome_arquivo Está Sendo Processado!\",\n}"
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
        409:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'O Arquivo Enviado Já Consta em Nosso Sistema'
                properties:
                  message:
                    type: string
                    example: 'O Arquivo Enviado Já Consta em Nosso Sistema'
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                arquivo:
                  type: string
                  format: binary
                  description: 'Must be a file. Must not be greater than 81920 kilobytes.'
                  nullable: false
              required:
                - arquivo
  '/api/upload-file/{name}':
    get:
      summary: 'Buscar Arquivos Por Nome'
      operationId: buscarArquivosPorNome
      description: '<p>Este Endpoint Realiza a Busca, e retorno das informações, referente aos arquivos, pelo nome do Arquivo</p>.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Documento(s) foram Encontrado(s)'
                  data:
                    -
                      nome: InstrumentsConsolidatedFile_20250128_1.csv
                      status: PROCESSADO
                      data_criacao: '02-02-2025 16:47:49'
                properties:
                  message:
                    type: string
                    example: 'Documento(s) foram Encontrado(s)'
                  data:
                    type: array
                    example:
                      -
                        nome: InstrumentsConsolidatedFile_20250128_1.csv
                        status: PROCESSADO
                        data_criacao: '02-02-2025 16:47:49'
                    items:
                      type: object
                      properties:
                        nome:
                          type: string
                          example: InstrumentsConsolidatedFile_20250128_1.csv
                        status:
                          type: string
                          example: PROCESSADO
                        data_criacao:
                          type: string
                          example: '02-02-2025 16:47:49'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
    parameters:
      -
        in: path
        name: name
        description: ''
        example: voluptatem
        required: true
        schema:
          type: string
  '/api/upload-file/item/{name}':
    get:
      summary: 'Buscar Informações do Arquivo'
      operationId: buscarInformaesDoArquivo
      description: '<p>Este Endpoint Realiza a Busca, e retorno das informações, referente aos itens(linhas) do arquivos, podendo passar os filtros de busca pelo params</p>.'
