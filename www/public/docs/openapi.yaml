\": false\n      },\n      {\n          \"url\": \"http://127.0.0.1:8084/api/upload-file/item/InstrumentsConsolidatedFile_20250128_1.csv?page=8\",\n          \"label\": \"8\",\n          \"active\": false\n      },\n      {\n          \"url\": \"http://127.0.0.1:8084/api/upload-file/item/InstrumentsConsolidatedFile_20250128_1.csv?page=9\",\n          \"label\": \"9\",\n          \"active\": false\n      },\n      {\n          \"url\": \"http://127.0.0.1:8084/api/upload-file/item/InstrumentsConsolidatedFile_20250128_1.csv?page=10\",\n          \"label\": \"10\",\n          \"active\": false\n      },\n      {\n          \"url\": null,\n          \"label\": \"...\",\n          \"active\": false\n      },\n      {\n          \"url\": \"http://127.0.0.1:8084/api/upload-file/item/InstrumentsConsolidatedFile_20250128_1.csv?page=1532\",\n          \"label\": \"1532\",\n          \"active\": false\n      },\n      {\n          \"url\": \"http://127.0.0.1:8084/api/upload-file/item/InstrumentsConsolidatedFile_20250128_1.csv?page=1533\",\n          \"label\": \"1533\",\n          \"active\": false\n      },\n      {\n          \"url\": \"http://127.0.0.1:8084/api/upload-file/item/InstrumentsConsolidatedFile_20250128_1.csv?page=2\",\n          \"label\": \"Next &raquo;\",\n          \"active\": false\n      }\n  ],\n  \"next_page_url\": \"http://127.0.0.1:8084/api/upload-file/item/InstrumentsConsolidatedFile_20250128_1.csv?page=2\",\n  \"path\": \"http://127.0.0.1:8084/api/upload-file/item/InstrumentsConsolidatedFile_20250128_1.csv\",\n  \"per_page\": 50,\n  \"prev_page_url\": null,\n  \"to\": 50,\n  \"total\": 76643\n}\n}"
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
    parameters:
      -
        in: path
        name: name
        description: ''
        example: numquam
        required: true
        schema:
          type: string
  '/api/upload-file-date/{createdDate}':
    get:
      summary: 'Buscar Arquivos Pela Data de Criação'
      operationId: buscarArquivosPelaDataDeCriao
      description: '<p>Este Endpoint Realiza a Busca, e retorno das informações, referente aos arquivos, pela sua data de criação</p>.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Documento(s) foram Encontrado(s)'
                  data:
                    -
                      nome: InstrumentsConsolidatedFile_20250128_1.csv
                      status: PROCESSADO
                      data_criacao: '02-02-2025 16:47:49'
                properties:
                  message:
                    type: string
                    example: 'Documento(s) foram Encontrado(s)'
                  data:
                    type: array
                    example:
                      -
                        nome: InstrumentsConsolidatedFile_20250128_1.csv
                        status: PROCESSADO
                        data_criacao: '02-02-2025 16:47:49'
                    items:
                      type: object
                      properties:
                        nome:
                          type: string
                          example: InstrumentsConsolidatedFile_20250128_1.csv
                        status:
                          type: string
                          example: PROCESSADO
                        data_criacao:
                          type: string
                          example: '02-02-2025 16:47:49'
        400:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'A Data Passada Não é Válida, ou Não está no formato Solicitado Y-m-d'
                  data: []
                properties:
                  message:
                    type: string
                    example: 'A Data Passada Não é Válida, ou Não está no formato Solicitado Y-m-d'
                  data:
                    type: array
                    example: []
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Não foi Encontrado Nenhum Documento Adicionando no Dia Solicitado'
                properties:
                  message:
                    type: string
                    example: 'Não foi Encontrado Nenhum Documento Adicionando no Dia Solicitado'
      tags:
        - Endpoints
    parameters:
      -
        in: path
        name: createdDate
        description: ''
        example: occaecati
        required: true
        schema:
          type: string
tags:
  -
    name: Endpoints
    description: ''
