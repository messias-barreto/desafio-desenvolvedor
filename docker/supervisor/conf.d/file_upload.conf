[program:file_upload-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /usr/share/nginx/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --queue=file_upload_queue
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=root
numprocs=2
redirect_stderr=true
stdout_logfile=/usr/share/nginx/html/storage/logs/file_upload.log
stopwaitsecs=3600